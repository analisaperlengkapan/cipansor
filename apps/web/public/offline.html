<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Cipansor</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 22rem;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: #16a34a;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 2rem;
        font-weight: 700;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #475569;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #16a34a;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f1f5f9;
        }
        p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">C</div>
      <h1>Tidak ada koneksi</h1>
      <p>
        Anda sedang offline. Periksa koneksi internet Anda, lalu coba muat ulang
        halaman.
      </p>
      <button onclick="location.reload()">Muat Ulang</button>
    </div>
  </body>
</html>
