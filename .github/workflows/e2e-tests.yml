name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Setup environment variables
        run: |
          # API environment
          cat > apps/api/.env << EOF
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cipansor_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          JWT_SECRET=test-jwt-secret-key-for-e2e-testing
          JWT_REFRESH_SECRET=test-jwt-refresh-secret-for-e2e
          JWT_EXPIRES_IN=1h
          JWT_REFRESH_EXPIRES_IN=7d
          CORS_ORIGIN=http://localhost:3000
          EOF

          # Web environment
          cat > apps/web/.env.local << EOF
          NEXT_PUBLIC_API_URL=http://localhost:3001
          NEXT_PUBLIC_WS_URL=ws://localhost:3001
          NODE_ENV=test
          EOF

      - name: Setup database
        run: |
          cd apps/api
          pnpm db:push
          pnpm db:seed

      - name: Build shared package
        run: pnpm --filter @cipansor/shared build

      - name: Build API
        run: cd apps/api && pnpm build

      - name: Start API server
        run: |
          cd apps/api
          pnpm start &
          echo $! > api.pid
          # Wait for API to be ready
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Build Web
        run: cd apps/web && pnpm build

      - name: Start Web server
        run: |
          cd apps/web
          pnpm start &
          echo $! > web.pid
          # Wait for Web to be ready
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run E2E tests
        run: cd apps/web && pnpm test:e2e
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: apps/web/test-results/
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          if [ -f apps/api/api.pid ]; then kill $(cat apps/api/api.pid) || true; fi
          if [ -f apps/web/web.pid ]; then kill $(cat apps/web/web.pid) || true; fi

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: daun/playwright-report-comment@v3
        with:
          report-path: apps/web/playwright-report

  # Separate job for running tests on multiple browsers
  e2e-cross-browser:
    name: E2E Tests (Cross-Browser)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    strategy:
      matrix:
        project: [chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install --with-deps ${{ matrix.project }}

      - name: Setup environment
        run: |
          cat > apps/api/.env << EOF
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cipansor_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          JWT_SECRET=test-jwt-secret
          JWT_REFRESH_SECRET=test-refresh-secret
          EOF

          cat > apps/web/.env.local << EOF
          NEXT_PUBLIC_API_URL=http://localhost:3001
          NEXT_PUBLIC_WS_URL=ws://localhost:3001
          EOF

      - name: Setup and start services
        run: |
          pnpm --filter @cipansor/shared build
          cd apps/api
          pnpm db:push
          pnpm db:seed
          pnpm build
          pnpm start &
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

          cd ../web
          pnpm build
          pnpm start &
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run E2E tests on ${{ matrix.project }}
        run: cd apps/web && pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 7
