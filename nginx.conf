events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Certificates are issued by Certbot. Keep these paths in sync with
    # /etc/letsencrypt/live/<domain>/ — the previous /etc/nginx/ssl/cipansor.crt
    # paths do not exist on the host and fail `nginx -t`.
    #
    # nginx 1.24 (Ubuntu 24.04) has no `http2 on;` directive; HTTP/2 is enabled
    # through the listen parameter below.

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Only send `Connection: upgrade` for requests that actually asked for it.
    # Hardcoding it breaks keep-alive on ordinary proxied requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    upstream web {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream api {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # --- HTTP: redirect everything to HTTPS --------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name cipansor.or.id www.cipansor.or.id;

        # ACME renewals must stay reachable over plain HTTP.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Bare IP or unknown Host: send visitors to the canonical domain instead of
    # presenting a certificate that cannot match it, which trips the Ad Grants
    # HTTPS check and shows a browser warning.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://cipansor.or.id$request_uri;
    }

    # --- HTTPS -------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name cipansor.or.id www.cipansor.or.id;

        ssl_certificate     /etc/letsencrypt/live/cipansor.or.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cipansor.or.id/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # --- Security headers ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Uploads; keep in step with MAX_FILE_SIZE in .env.
        client_max_body_size 10M;

        # Next.js build output is content-hashed, so it can be cached forever.
        location /_next/static/ {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Assets we ship ourselves. Shorter TTL since these filenames are stable.
        location /images/ {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "public, max-age=2592000" always;
        }

        # Static assets by extension.
        #
        # This is a *regex* location, and in nginx a matching regex beats any
        # plain prefix location. That is why the two blocks below use `^~`:
        # without it every /api/… or /uploads/… request whose path happens to
        # end in .png or .jpg would be answered by the web container instead of
        # the API, along with a 30-day public cache header.
        location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "public, max-age=2592000" always;
        }

        # User uploads: santri photos, e-simaan recordings, attachments.
        #
        # There was no location for these at all, so they fell through to the
        # web container and every uploaded file answered with the Next.js 404
        # page — `curl -I https://…/uploads/x.png` returned 404 text/html. The
        # API has served them from public/uploads all along; nothing ever
        # routed there. Deliberately no Cache-Control: these are personal data
        # under UU 27/2022 PDP, not shared assets.
        location ^~ /uploads/ {
            proxy_pass http://api;
            proxy_cache_bypass $http_upgrade;
        }

        # API backend
        location ^~ /api {
            proxy_pass http://api;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # Health check.
        #
        # This used to live at `/health`. That is a *prefix* match, so it also
        # swallowed `/health/records`, `/health/medications` and the rest of
        # the Kesehatan module — the whole clinic section of the web app was
        # unreachable, answering with the API's JSON health blob instead of a
        # page. `/healthz` cannot collide with an app route.
        #
        # NOTE: any external uptime monitor pointed at https://…/health must be
        # repointed here. The container healthchecks in docker-compose.yml hit
        # the API directly on :3001/health and are unaffected.
        location = /healthz {
            proxy_pass http://api/health;
            access_log off;
        }

        # Web frontend
        location / {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
