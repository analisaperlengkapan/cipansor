packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
resolutionMode: highest

overrides:
  qs: "^6.15.2"
  "@types/express-serve-static-core": "5.1.0"
  fast-uri: ">=3.1.2"
  form-data: ">=4.0.6"
  hono: ">=4.12.25"
  "@hono/node-server": "^1.19.13"
  multer: ">=2.2.0"
  next: ">=16.2.5"
  nodemailer: ">=9.0.1"
  rollup: ">=4.22.4"
  ws: "^8.21.1"
  dompurify: "^3.4.12"
  js-yaml: "^4.1.2"
  "@babel/core": "^7.29.1"
  vite: ">=8.1.4"
  postcss: "^8.5.16"
